name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A push that lands while an earlier run is still going cancels it: nothing here
# depends on history.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ubuntu 24.04 ships Verilator 5.020, which pins cocotb to 1.9.x. See the note in
  # the Makefile and in docs/DESIGN.md under "Tool support".
  DEBIAN_FRONTEND: noninteractive

jobs:
  lint:
    name: lint and generated files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends verilator yosys
          verilator --version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: create the venv
        run: make venv
      # Runs the generators and diffs their output against the tree, so a hand edit
      # to a generated file, or a change to a generator without regenerating,
      # fails here rather than surfacing as a mysterious mismatch later.
      - name: generated files are up to date
        run: make check-gen
      - name: lint
        run: make lint-core lint-wrap lint-configs
      # Yosys-only, no PDK needed: asserts the design infers no multiplier.
      - name: arithmetic audit
        run: make arith

  test:
    name: simulation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends verilator
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: create the venv
        run: make venv
      # Smaller sweeps than a local run: the same tests over fewer random
      # arguments, so a CI run stays inside a sensible wall clock while every
      # directed and edge case still runs, since those are not sampled.
      - name: run the suite
        run: make test ACC_SAMPLES=300 DOMAIN_SAMPLES=200 EQUIV_SAMPLES=400 STREAM_OPS=128
      - name: upload the measured results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-results
          path: build/results/
          if-no-files-found: warn

  synth:
    name: synthesis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends yosys
          yosys -V
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: create the venv
        run: make venv
      - name: synthesise every configuration
        run: make synth
      # The committed reports have to match what Yosys just produced, which is what
      # stops the numbers quoted in the README from going stale.
      - name: committed reports match this run
        run: |
          if ! git diff --exit-code -- docs/synth; then
            echo "::error::docs/synth differs from this run. Run 'make synth' and commit the reports."
            exit 1
          fi
          echo "committed synthesis reports match"
      - name: upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synth-reports
          path: docs/synth/

  # The real IHP SG13G2 numbers in docs/pdk and docs/pnr are produced locally by
  # `make pdk` and `make pnr`. They are not regenerated here: the PDK is a large
  # external tree and OpenROAD comes from a container, neither of which belongs on a
  # hosted runner. What CI can do is check the committed artefacts are self-consistent
  # with the figures drawn from them, which the figures job below does.
  pdk-consistency:
    name: committed PDK results are consistent
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: create the venv
        run: make venv
      - name: every configuration has a report and a summary entry
        run: |
          .venv/bin/python - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path('.')
          summary = json.loads((root / 'docs/pdk/summary.json').read_text())
          rc = 0
          for name, v in summary.items():
              rpt = root / 'docs/pdk' / f'{name}.rpt'
              if not rpt.exists():
                  print(f'{name}: missing {rpt}', file=sys.stderr); rc = 1
                  continue
              text = rpt.read_text()
              # The area and the slow-corner Fmax in the report must match the JSON
              # the figures are drawn from.
              area = f"{v['synth_area_um2']:.1f}"
              if area not in text:
                  print(f'{name}: area {area} not in the report', file=sys.stderr)
                  rc = 1
              for corner in ('slow', 'typ', 'fast'):
                  if corner not in v['corners']:
                      print(f'{name}: no {corner} corner', file=sys.stderr); rc = 1
              if v['corners']['slow']['fmax_mhz'] is None:
                  print(f'{name}: no slow-corner Fmax', file=sys.stderr); rc = 1
          print(f'{len(summary)} configurations, reports and summary agree')
          sys.exit(rc)
          PY

  software:
    name: driver
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install the RISC-V toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-riscv64-unknown-elf
          riscv64-unknown-elf-gcc --version | head -1
          riscv64-unknown-elf-gcc -print-multi-lib
      - name: create the venv
        run: make venv
      # Runs the host build and links the RV32 image. The RV32 image is not
      # executed: there is no Croc simulation here. See sw/README.md.
      - name: driver test and RV32 image
        run: make sw
      - name: upload the RV32 image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rv32-image
          path: |
            build/sw/test_cordic_rv32.elf
            build/sw/test_cordic_rv32.map
          if-no-files-found: warn

  figures:
    name: figures
    needs: [test, synth]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends verilator yosys
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: create the venv
        run: make venv
      # The figures are drawn from measured data, so the data has to be produced
      # here before they can be regenerated. A short run is enough to redraw them;
      # the committed versions come from a full local run.
      - name: produce the measurements
        run: |
          make test ACC_SAMPLES=200 DOMAIN_SAMPLES=100 EQUIV_SAMPLES=200 STREAM_OPS=128
          make synth-quick
      # The PDK-derived figures are redrawn from the committed docs/pdk/summary.json,
      # since the PDK itself is not available here. That still catches a plotting
      # script that no longer matches the data it is given.
      - name: regenerate the figures
        run: make images
      - name: every SVG is well formed
        run: .venv/bin/python scripts/check_svg.py
      - name: upload the figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figures
          path: docs/img/
